<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div_Tag</title>
    <style>
        #header{
            color:red;
        
        }

        .footer{
            color:greenyellow;
        }
    </style>

</head>
<body>
    <!-- Div tag act as a container which contains all type of tags 
      - it is most important Tag for the styling and other methods to assign some task
        or attributes. -->

        <div>
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos dicta placeat recusandae. Aspernatur earum, quae facilis facere voluptate, blanditiis fugit, illum numquam tempora dignissimos laborum? Sint esse maiores nemo sequi?
            </p>
            <h1>Heading</h1>
        </div>

        <!-- Both <p> and <h1> is now a part of "Div" tag. now whatever styling is applied 
             to the "Div", those same will be applied on the tags inside "Div" like: <P> and <h1> -->

 <!-- ID ATTRIBUTE:  -->
        <!-- This is an attribute which can be used for different element but shoult be used once for single page is "Recommended"
             to avoid errors and problems in the UI.
             This "ID" Attribute is given to a unique Identifier that is used to identify a document. -->

 <!-- For Example: -->

                <div id="header">
                    Header
                </div>
<!-- Styling is done using "#" symbol in ID attribute -->

<!-- "Class" Attribute:   -->
 <!-- It is used for all the element to provide them name as an element.
    To describe and provide meaning to a speacific elements of "HTML"
    This is use to provide style or property or interact with methods by using "Class name" 
    for a speacific element -->

                <div class="footer">
                    Footer
                </div>
                
<!-- Styling is done using "." symbol in "Class" attribute 
  --> 
 

</body>
</html>
